    # Runaway dwarves
    # Once you kill the leader near the spider room, you meet three dwarves
    # that escaped from the dungeon some time ago.
    [event]
        name=die
        [filter]
            side=5
            canrecruit=yes
        [/filter]

        [unit]
            type=Dwarvish Steelclad
            id=Dulcatas
            name= _ "Dulcatas"
            side=1
            x,y=4,8
            [modifications]
                {TRAIT_LOYAL}
                {TRAIT_HEALTHY}
            [/modifications]
        [/unit]

        [unit]
            type=Dwarvish Thunderguard
            id=Antolos
            name= _ "Antolos"
            side=1
            x,y=7,10
            [modifications]
                {TRAIT_LOYAL}
                {TRAIT_STRONG}
            [/modifications]
        [/unit]

        [unit]
            type=Dwarvish Fighter
            id=Varem
            name= _ "Varem"
            side=1
            x,y=6,13
            [modifications]
                {TRAIT_LOYAL}
                {TRAIT_RESILIENT}
            [/modifications]
        [/unit]

        [message]
            speaker=Dulcatas
            message= _ "Halt! Who goes there? Friend or foe?"
        [/message]

        [message]
            speaker=second_unit
            message= _ "Depends. Are you loyal to Malifor?"
        [/message]

        [message]
            speaker=Dulcatas
            message= _ "Never! If you ha’ been sent by Malifor, then know that we will never yield! Come and meet your death!"
        [/message]

        [message]
            speaker=second_unit
            message= _ "Hold! We aren’t friends of Malifor in the least. Rather, we have come to destroy him."
        [/message]

        [message]
            speaker=Dulcatas
            message= _ "Finally! You don’t know how long we have been waiting for this day."
        [/message]

        [message]
            speaker=second_unit
            message= _ "How did you get here and how long have you been here?"
        [/message]

        [message]
            speaker=Dulcatas
            message= _ "We were originally prisoners of Malifor, but we tunneled out and escaped. Since then, we have eked out a precarious survival on what we have been able to steal or raid from Malifor."
        [/message]
        [message]
            speaker=Dulcatas
            message= _ "And stay away frow Great Chamber. Malifor put prisoners to fight againts giant spiders for fun there."
        [/message]
[/event]

# The spider ambush
    # On entering the great chamber two stone blocks cut off the way
    # back and a number of giant spiders spawn to harass the player.
    [event]
        name=moveto
        [filter]
            side=1
            x=10-18,11-17
            y=1-6,7
        [/filter]

        [scroll_to]
            x,y=14,4
        [/scroll_to]

        [message]
            speaker=unit
            message= _ "So this is the Great Chamber, eh? Doesn’t look like there is much to see here."
        [/message]

        {QUAKE "rumble.ogg"}

        [message]
            speaker=narrator
            image=wesnoth-icon.png
            message= _ "The ground shakes."
        [/message]

        [message]
            speaker=unit
            message= _ "Perhaps I spoke too soon..."
        [/message]

        {QUAKE "cave-in.ogg"}
        {QUAKE "cave-in.ogg"}

        # Cutting off the exit
        [terrain]
            x=9,10
            y=7,7
            terrain=Xu
        [/terrain]

        # When cutting off the exit, test for units on the wall, if there are units on the wall, teleport them back

        [if]
            [have_unit]
                side=1
                x=9,7
            [/have_unit]
            [then]
                [teleport]
                    [filter]
                        x,y=9,7
                    [/filter]
                    x,y=10,7
                    check_passability=yes
                [/teleport]
            [/then]
        [/if]

        [if]
            [have_unit]
                side=1
                x=10,7
            [/have_unit]
            [then]
                [teleport]
                    [filter]
                        x,y=10,7
                    [/filter]
                    x,y=9,7
                    check_passability=yes
                [/teleport]
            [/then]
        [/if]

        [redraw][/redraw]

        [message]
            speaker=unit
            message= _ "What is this? Our retreat is cut off!"
        [/message]

        # Spawning spiders depending on difficulty
        {NOTRAIT_UNIT 6 "Giant Spider" 6 2}
        {NOTRAIT_UNIT 6 "Giant Spider" 6 3}
        {NOTRAIT_UNIT 6 "Giant Spider" 5 5}
        {NOTRAIT_UNIT 6 "Giant Spider" 5 3}
        {NOTRAIT_UNIT 6 "Giant Spider" 5 2}
        {NOTRAIT_UNIT 6 "Giant Spider" 20 2}
        {NOTRAIT_UNIT 6 "Giant Spider" 20 1}
#ifndef EASY
        {NOTRAIT_UNIT 6 "Giant Spider" 8 2}
        {NOTRAIT_UNIT 6 "Giant Spider" 8 3}
        {NOTRAIT_UNIT 6 "Giant Spider" 22 2}
        {NOTRAIT_UNIT 6 "Giant Spider" 22 3}
#ifndef NORMAL
        {NOTRAIT_UNIT 6 "Giant Spider" 4 2}
        {NOTRAIT_UNIT 6 "Giant Spider" 5 4}
        {NOTRAIT_UNIT 6 "Giant Spider" 20 3}
#endif
#endif

        {QUAKE "cave-in.ogg"}
        {QUAKE "cave-in.ogg"}

        # Break some walls exposing side tunnels
        [terrain]
            x=19,19,9,9
            y=3,4,3,4
            terrain=Uu
        [/terrain]

        {PLACE_IMAGE scenery/dwarven-doors-closed.png 22 4}

        [redraw]
            side=1
        [/redraw]

        [message]
            type=Giant Spider
            message= _ "Hsssss"
        [/message]

        [message]
            speaker=unit
            message= _ "‘Great Chamber’, my foot! This is a death chamber!"
        [/message]

        #You can enter from the study, but only if you've already triggered the spiders
        [event]
            name=moveto
            first_time_only=no
            [filter]
                x,y=23,5
            [/filter]
            [filter_condition]
                [variable]
                    name=spider_door_opened
                    boolean_equals=no
                [/variable]
            [/filter_condition]

            [message]
                speaker=unit
                message= _ "Hmmm. The wall appears weak here. I think there might be something on the other side."
            [/message]

            [sound]
                name=cave-in.ogg
            [/sound]

            [terrain]
                x,y=22,4
                terrain=Uu
            [/terrain]

            [message]
                speaker=unit
                message= _ "There we go."
            [/message]

            {VARIABLE spider_door_opened yes}
        [/event]
    [/event]

       

