#textdomain wesnoth-nr

[scenario]
    id=15_doors
    name= _ "15 Capture doors"
    map_file=22_doors.map
    turns=30
    next_scenario=overworld

    {DEFAULT_SCHEDULE}

    {SCENARIO_MUSIC       breaking_the_chains.ogg}
    {EXTRA_SCENARIO_MUSIC knalgan_theme.ogg}
    {EXTRA_SCENARIO_MUSIC wanderer.ogg}


    
    # Players side
[side]
        side=1
        controller=human
        gold={ON_DIFFICULTY4 200 200 200 400}
        team_name=alliance
        user_team_name= _ "Talin"
        facing=nw
	type=Peasant
        id=talin
        name=_ "Tallin"
        canrecruit=yes
        side=1

  [/side]   
    
    # Main enemy. Note the AI is set to be highly aggressive and target Tallin
    [side]
        side=2
        controller=ai
        recruit=Orcish Grunt,Orcish Archer,Wolf Rider,Orcish Assassin,Troll Whelp,Orcish Warrior,Orcish Crossbowman,Troll
        gold={ON_DIFFICULTY4 200 250 375 800}
        income={ON_DIFFICULTY4 10 15 25 60}
        team_name=orcs
        user_team_name= _ "Orcs"
        {FLAG_VARIANT6 ragged}

       	type=Orcish Warlord
    	id=AlTar
    	name= _ "Al'Tar"
    	canrecruit=yes

        [ai]
            aggression=1.0
            caution=-1.0
            leader_value=50
            passive_leader=yes
        [/ai]

    [/side]
    # wmllint: validate-on

    # Sidekicks
    [side]
        side=3
        controller=ai
        recruit=Orcish Grunt,Orcish Archer,Wolf Rider,Orcish Assassin,Troll Whelp,Orcish Warrior,Orcish Crossbowman,Troll
        gold={ON_DIFFICULTY4 100 125 175 400}
        team_name=orcs
        user_team_name= _ "Orcs"
        {FLAG_VARIANT6 ragged}
        color=purple
        type=Orcish Warrior
        id=tavro
        name= _ "Tavro"
        canrecruit=yes
        profile=portraits/orcs/grunt-4.webp

        [ai]
            aggression=1.0
            caution=-1.0
            leader_value=50
        [/ai]
    [/side]

    
    {STARTING_VILLAGES 1 4}

    [event]
        name=prestart

        [time_area]
            x=20-27,21-27,21-27,21-27,21-27,22-27,23,25-27,27
            y=1    ,2    ,3    ,4    ,5    ,6    ,7 ,7    ,8
            {UNDERGROUND}
        [/time_area]
        [item]
			id="gold-coins-medium"
			image="items/gold-coins-medium.png"
			submerge=1
			visible_in_fog=no
			x=4
			y=9
		[/item]
        # Recall heroes and a supporter
        {RECALLCOMPANIONS}

        
        [objectives]
            side=1

            [objective]
                description= _ "Defeat Al'Tar"
                condition=win
                show_turn_counter=yes
            [/objective]

            [objective]
                description= _ "Death of Tallin"
                condition=lose
            [/objective]

            [gold_carryover]
                carryover_percentage=40
            [/gold_carryover]
        [/objectives]
    [/event]


    # Do the talk
    [event]
        name=start

        [message]
            id=AlTar
            message= _ "So slaves returned. Tallin must die but others can serve me again."
        [/message]

        [message]
            id=talin
            message= _ "We come here to defeat you"
        [/message]

        [message]
            id=AlTar
            # wmllint: local spelling Pah
            message= _ "Pah! I will defeat you!"
        [/message]
        [message]
            id=tavro
            message= _ "I will help you to defeat slaves. <i> (in low woice) Rakhas will dealt with you later </i>."
        [/message]
    [/event]


    #gold pick up
    [event]
		name=moveto
		[filter]
			x=4
			y=9
			side=1
		[/filter]
		[message]
			speaker=$unit.id
			message= _ "I found 100 gold."
		[/message]
		[gold]
			side=1
			amount=100
		[/gold]
		[remove_item]
					[filter]
						x=4
						y=9
					[/filter]
				[/remove_item]

	[/event]

    [event]
        name=die
        [filter]
            id=AlTar
        [/filter]
                [message]
                    speaker=second_unit
                    message= _ "Not a very bright one, was he?"
                [/message]
                [message]
                    speaker=tavro
                    message= _ "Slaves defeated Al'Tar. Retreat back to Abez, Rakhas will dealt this personaly."
                [/message]
                [endlevel]
                    result=victory
                    bonus=yes
                [/endlevel]
    [/event]

    [event]
        name=die
        [filter]
            id=tavro
        [/filter]
                [message]
                    speaker=tavro
                    message= _ "This wasn't in my plan!"
                [/message]
    [/event]

    # Time over.
    [event]
        name=time over

        [message]
            id=talin
            message= _ "We were too slow!"
        [/message]
	
        [endlevel]
            result=defeat
            bonus=no
        [/endlevel]
    [/event]

    # And load the standard death events.
    {HERODEATHS}
    
[/scenario]
