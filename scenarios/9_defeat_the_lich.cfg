#define SHOW_FIRE X Y
        [terrain]
            x={X}
            y={Y}
            terrain="^Ebn"
            layer=overlay
        [/terrain]
        [remove_shroud]
            x, y, radius= {X}, {Y}, 3
        [/remove_shroud]
        [redraw][/redraw]
        [delay]
            time=200
        [/delay]
#enddef

#define END_SHOW_FIRE X Y
        [terrain]
            x={X}
            y={Y}
            terrain="^Eb"
            layer=overlay
        [/terrain]
        [place_shroud]
            x, y, radius= {X}, {Y}, 3
        [/place_shroud]
#enddef
        

