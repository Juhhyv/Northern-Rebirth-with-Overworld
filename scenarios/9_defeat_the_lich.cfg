#define TREASURY_GOLD_EVENT _X _Y _AMOUNT _MESSAGE
    [event]
        name=moveto
        [filter]
            x,y={_X},{_Y}
            side=1
        [/filter]

        [message]
            speaker=unit
            message={_MESSAGE}
        [/message]

        [sound]
            name=gold.ogg
        [/sound]

        [gold]
            side=1
            amount={_AMOUNT}
        [/gold]

        [floating_text]
            x,y={_X},{_Y}
            color=225,225,25
            text={_AMOUNT}
        [/floating_text]

        [remove_item]
            x,y=$x1,$y1
        [/remove_item]
    [/event]
#enddef



 # Gold chests. The main feature of this room.
    {TREASURY_GOLD_EVENT 6 3 800  ( _ "There are at least several hundred gold coins in here!")}

    {TREASURY_GOLD_EVENT 5 7 500  ( _ "I don’t think the undead will be be needing this anyway.")}

    {TREASURY_GOLD_EVENT 12 2 1000 ( _ "Our people could rebuild their lives ten-fold with the gold in this treasury.")}

    {TREASURY_GOLD_EVENT 14 4 300  ( _ "We’re rich!")}

    
#undef TREASURY_GOLD_EVENT

	[event]
		name=moveto
		first_time_only=no
		[filter]
			x=7
			y=8
			side=1
		[/filter]
		[if]
			[or]
			[have_unit]
						x,y= 7, 8
						id=talin
			[/have_unit]

			[/or]
			[have_unit]
						x,y= 7, 8
						id=Zlex
			[/have_unit]						
			
			
					[then]
						[message]
							speaker=$unit.id
							message= _ "There is rod in that chest. I take it-"
						[/message]
						[message]
							speaker=narrator
							message= _ "You found legendary Rod of Justice."
						[/message]
					[remove_item]
						[filter]
							x=7
							y=8
						[/filter]
					[/remove_item]
					
						[object]
                        id=justice_rod
                        name= _ "Rod of Justice"
                        image=attacks/staff-magic.png
                        duration=forever
                        description= _ "A magical staff of tremendous power and unknown origin. Although the full extent of its power has not been fathomed, there are a few features about it that will be obvious to any master of lore. The wielder of this staff gains a dramatic increase in strength, speed and intelligence, and is granted the ability to fire devastating lightning bolts at his opponents. Only a person who is good at heart and who is willing to sacrifice his life on the path of justice can wield this staff."
                        [filter]
                            id=$unit.id
                        [/filter]

                        # New 16-4 fire attack with cool lightning animation
                        [effect]
                            apply_to=new_attack
                            name=rod of justice
                            description= _ "rod of justice"
                            type=fire
                            range=ranged
                            damage=16
                            number=4
                            icon=attacks/lightning.png
                            [specials]
                                {WEAPON_SPECIAL_MAGICAL}
                            [/specials]
                        [/effect]

                        # The halo mod is used to give the bolts a slightly
                        # different color than the originals
                        [effect]
                            apply_to=new_animation
                            [attack_anim]
                                [filter_attack]
                                    name=rod of justice
                                [/filter_attack]
                                {LIGHTNING_BOLT 1}
                                [+missile_frame]
                                    halo_mod="~SWAP(alpha,green,green)"
                                [/missile_frame]
                                {SOUND:HIT_AND_MISS lightning.ogg lightning-miss.ogg -300}
                            [/attack_anim]
                            [attack_anim]
                                [filter_attack]
                                    name=rod of justice
                                [/filter_attack]
                                {LIGHTNING_BOLT 2}
                                [+missile_frame]
                                    halo_mod="~SWAP(alpha,green,green)"
                                [/missile_frame]
                                {SOUND:HIT_AND_MISS lightning.ogg lightning-miss.ogg -300}
                            [/attack_anim]
                            [attack_anim]
                                [filter_attack]
                                    name=rod of justice
                                [/filter_attack]
                                {LIGHTNING_BOLT 3}
                                [+missile_frame]
                                    halo_mod="~SWAP(alpha,green,green)"
                                [/missile_frame]
                                {SOUND:HIT_AND_MISS lightning.ogg lightning-miss.ogg -300}
                            [/attack_anim]
                        [/effect]

                        # Increase the movement by 2
                        [effect]
                            apply_to=movement
                            increase=2
                        [/effect]

                        # If the unit has melee attacks, increase the damage of
                        # all of them by two
                        [effect]
                            apply_to=attack
                            range=melee
                            increase_damage=2
                        [/effect]

                        # Give the unit additional 10 HP and heal it
                        [effect]
                            apply_to=hitpoints
                            increase_total=10
                            heal_full=yes
                        [/effect]

                        # Reduce the amount of experience required for next level
                        # by 20%
                        [effect]
                            apply_to=max_experience
                            increase=-20%
                        [/effect]
                    [/object]
			[set_variable]
				name=rod
				value=yes
			[/set_variable]
			[if]
					[variable]
						name=unit.id
						not_equals=talin
					[/variable]
					[then]
						[set_achievement]
							content_for=nro
							id=rod
						[/set_achievement]	
					[/then]
		[/if]

		[/then]
		[else]
			[if]
					[variable]
						name=rod
						not_equals=yes
					[/variable]
					[then]
						[message]
							speaker=$unit.id
							message= _ "I can't open the chest"
						[/message]
						[message]
							speaker=talin
							message= _ "Maybe I need to try."
						[/message]
					[/then]
			[/if]
		[/else]
	[/if]
	[/event]

		

    

